version: 12
board:
  name: Custom Colors Demo
tasks_dir: tasks
statuses:
  - name: backlog
  - name: todo
  - name: in-progress
  - name: review
  - name: qa
  - name: done
priorities:
  - low
  - medium
  - high
  - critical
defaults:
  status: backlog
  priority: medium
tui:
  title_lines: 2
  thick_card_border: true
  # Only the terminal theme is used: ANSI 0-15 are the theme's palette,
  # `default` is its own foreground/background, `faint` dims text. The selected
  # column header and the selected card share one color (KBMD_ACCENT, default 4).
  colors:
    column_header_fg: 14 #"default"
    column_header_bg: "default"
    active_header_fg: "default"
    active_header_bg: "${KBMD_ACCENT:-4}"
    active_border: "${KBMD_ACCENT:-4}"
    drop_target_fg: "default"
    drop_target_bg: "2"
    card_border: "8"
    blocked_border: "1"
    text: "default"
    dim: "default faint"
    error: "1"
    priority_critical: "1"
    priority_high: "5"
    priority_medium: "2"
    priority_low: "default faint"
    tab_fg: "default faint"
    tab_bg: "default"
    claim: "4"
    list_header: "default faint"
    tag: 14
next_id: 8
